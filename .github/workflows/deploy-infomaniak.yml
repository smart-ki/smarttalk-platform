name: Deploy to Infomaniak VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of cancelling one mid-flight.
concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Host key is pinned via DEPLOY_KNOWN_HOSTS (security audit 2026-11, INF-68392C).
      # A blind ssh-keyscan trusts whatever answers on that IP (MITM on first contact).
      # Fallback to keyscan only while the secret is not set yet.
      - name: Setup SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set - falling back to ssh-keyscan (unpinned host key)"
            ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}

      # The key is locked to a forced command on the server (authorized_keys),
      # so it can only run the deploy script for /home/ki-smarttalk/app.
      # The argument below is ignored by the forced command.
      - name: Trigger deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${HOST}" deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
